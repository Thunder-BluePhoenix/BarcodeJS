name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run size

  # Second, independent decoder: zxing-cpp reads Micro QR, Aztec, PDF417, 144x144 Data Matrix,
  # UTF-8 (ECI) and other cases zxing-js cannot.
  zxing-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r test/zxing-cpp/requirements.txt
      - run: npm ci
      # Fixed cases + 60 seeded random values per format; the seed changes every run (printed for reproduction)
      - run: npm run test:zxing-cpp
        env:
          FUZZ: 60
          SEED: ${{ github.run_number }}

# Release: `npm version patch|minor|major && git push --follow-tags`
# Needs repository secret NPM_TOKEN (npm automation token) and the @thunder-bluephoenix scope on npm and jsr.io.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write # npm provenance + JSR OIDC publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run size
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npx jsr@0.14.3 publish
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/barcode.min.js dist/barcode.esm.min.js
        env:
          GH_TOKEN: ${{ github.token }}
